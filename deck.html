<title>H1 2026 Manager Review</title>
<style>
:root{
  --ink:#12241E; --body:#3E5049; --muted:#86958E; --line:#DFE6E2;
  --canvas:#F7F9F8; --card:#FFFFFF; --wash:#FAFCFB; --dark:#112A22;
  --green:#2E8B57; --grn-lt:#A8D5BA; --grey-lt:#C7D2CC;
  --red:#C0392B; --amber:#C98A1B; --plum:#7B5EA7; --slate:#5B7C99;
  --stage-bg:#E7EDE9;
  --font:"Helvetica Neue","Helvetica","Inter",-apple-system,BlinkMacSystemFont,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--canvas);color:var(--body);font-family:var(--font);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;color:inherit}

#viewport{position:fixed;inset:0;display:grid;place-items:center;background:var(--canvas)}
#stage{
  width:1280px;height:720px;position:relative;flex:none;transform-origin:center center;
  background:var(--canvas);overflow:hidden;
}
.slide{
  position:absolute;inset:0;background:var(--canvas);
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .26s ease;
}
.slide.on{opacity:1;visibility:visible;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}

/* every element is placed by absolute inch-derived coordinates */
.b{position:absolute}
.t{position:absolute;white-space:pre-wrap}
.card{position:absolute;background:var(--card);border:1px solid var(--line)}
.acc{position:absolute}

/* charts */
.plot{position:absolute}
.plot svg{width:100%;height:100%;display:block;overflow:visible}
.grid line{stroke:var(--line);stroke-width:1;shape-rendering:crispEdges}
.ax{font-family:var(--font);font-variant-numeric:tabular-nums;fill:var(--muted)}
.hit{fill:transparent;cursor:crosshair}
.mk{transition:opacity .12s ease}
.dim .mk{opacity:.28}
.dim .mk.hi{opacity:1}

/* the Data / table affordance stays hidden until the card is hovered,
   so the deck at rest is pixel-for-pixel the printed slide */
.tbtn{
  position:absolute;background:var(--card);border:1px solid var(--line);border-radius:4px;
  cursor:pointer;font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:3px 7px;opacity:0;transition:opacity .15s ease;z-index:5;
}
.card:hover ~ .tbtn,.tbtn:hover,.tbtn:focus-visible,.plot:hover + .tbtn{opacity:1}
.tbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;opacity:1}
.tv{position:absolute;background:var(--card);overflow:auto;display:none;z-index:4}
.tv.on{display:block}
.tv table{border-collapse:collapse;width:100%;font-size:9px;font-variant-numeric:tabular-nums}
.tv th,.tv td{padding:2.5px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tv th:first-child,.tv td:first-child{text-align:left}
.tv th{color:var(--muted);font-weight:700;font-size:8px;letter-spacing:.06em;text-transform:uppercase;
  position:sticky;top:0;background:var(--card)}

/* draw-in */
.slide .gy{transform:scaleY(.001);transform-origin:var(--ox,center) var(--oy,bottom)}
.slide.on .gy{transform:scaleY(1);transition:transform .5s cubic-bezier(.2,.7,.3,1);transition-delay:var(--d,0s)}
.slide .gx{transform:scaleX(.001);transform-origin:var(--ox,left) center}
.slide.on .gx{transform:scaleX(1);transition:transform .55s cubic-bezier(.2,.7,.3,1);transition-delay:var(--d,0s)}
.slide .fi{opacity:0}
.slide.on .fi{opacity:1;transition:opacity .4s ease;transition-delay:var(--d,.4s)}
@media (prefers-reduced-motion:reduce){
  .slide .gy,.slide .gx{transform:none}.slide .fi{opacity:1}
  .slide.on .gy,.slide.on .gx,.slide.on .fi{transition:none}
}

#tip{
  position:fixed;z-index:60;pointer-events:none;opacity:0;background:var(--dark);color:#fff;
  border-radius:6px;padding:8px 10px;font-size:11px;line-height:1.4;
  box-shadow:0 6px 20px rgba(11,31,25,.3);transition:opacity .1s ease;max-width:280px;
}
#tip.on{opacity:1}
#tip .th{font-weight:700;margin-bottom:4px}
#tip .tr{display:flex;align-items:center;gap:7px;white-space:nowrap}
#tip .tr .sw{width:8px;height:8px;border-radius:2px;flex:none}
#tip .tr .k{color:#B9CCC3;flex:1}
#tip .tr .v{font-weight:700;font-variant-numeric:tabular-nums}

#bar{
  position:fixed;left:0;right:0;bottom:0;height:38px;display:flex;align-items:center;gap:14px;
  padding:0 16px;background:rgba(247,249,248,.92);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);z-index:40;
  opacity:0;transition:opacity .25s ease;
}
#bar.show,#bar:hover,#bar:focus-within{opacity:1}
#bar .nb{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:4px;font-size:12px;line-height:1}
#bar .nb:hover{color:var(--ink);background:var(--line)}
#bar .nb:focus-visible,.tbtn:focus-visible{outline:2px solid var(--green);outline-offset:1px}
#dots{display:flex;gap:5px;flex:1;align-items:center}
#dots button{flex:1;height:3px;border:0;padding:0;background:var(--line);border-radius:2px;cursor:pointer;transition:background .2s}
#dots button:hover{background:var(--muted)}
#dots button[aria-current="true"]{background:var(--green)}
#count{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
#hint{font-size:10px;color:var(--muted)}
#ov{position:fixed;inset:0;z-index:50;background:rgba(231,237,233,.97);display:none;
  grid-template-columns:repeat(4,1fr);gap:16px;padding:28px;align-content:start;overflow:auto}
#ov.on{display:grid}
#ov .ot{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:14px 15px;
  cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:78px}
#ov .ot:hover{border-color:var(--green)}
#ov .ot .num{font-size:9px;font-weight:700;color:var(--green);letter-spacing:.09em}
#ov .ot .ttl{font-size:13px;font-weight:700;color:var(--ink);line-height:1.22}
</style>

<div id="viewport"><div id="stage" role="region" aria-label="H1 2026 Manager Review"></div></div>
<div id="tip" role="status" aria-live="polite"></div>
<nav id="bar">
  <button class="nb" id="prev" aria-label="Previous slide">←</button>
  <button class="nb" id="next" aria-label="Next slide">→</button>
  <div id="dots"></div><span id="count"></span>
  <button class="nb" id="ovb" aria-label="Slide overview">☰</button>
  <span id="hint">← → · O overview</span>
</nav>
<div id="ov" role="dialog" aria-label="All slides"></div>

function el(t,a={},kids=[]){

function h(t,a={},kids=[]){

    else if(k.startsWith("on")) n.addEventListener(k.slice(2),a[k]);

}

function box(s,x,y,w,hh,cls,style){
  const n=h("div",{class:cls||"b",style:
    `left:${px(x)}px;top:${px(y)}px;width:${px(w)}px;height:${px(hh)}px;`+(style||"")});

/* rounded rect: PowerPoint roundRect adj a -> radius = a * min(w,h) */
function cardBox(s,x,y,w,hh,{fill="var(--card)",border="var(--line)",adj=0.060}={}){
  const r=adj*Math.min(w,hh);
  return box(s,x,y,w,hh,"card",
    `background:${fill};${border?`border:1px solid ${border};`:"border:0;"}border-radius:${px(r)}px;`);
}
function txt(s,x,y,w,hh,str,{size=12,bold=false,color="var(--body)",align="left",ls=1.0}={}){

      document.createTextNode(str)).parentNode;

/* chart mount: absolute plot + hidden Data button + table view */
function mount(s,x,y,w,hh,fn){
  const host=box(s,x,y,w,hh,"plot");
  const out=fn(host,w,hh)||{};
  if(out.table){
    const tv=h("div",{class:"tv",style:
      `left:${px(x)}px;top:${px(y)}px;width:${px(w)}px;height:${px(hh)}px;padding:4px 10px`},out.table);

    btn.addEventListener("click",()=>{
      const on=tv.classList.toggle("on"); btn.setAttribute("aria-pressed",String(on));
    });
    s.append(tv,btn);
  }
  return host;
}

function chartCuke(host,W_in,H_in){
  const W=1000,H=W*H_in/W_in;

  const INI=["J","F","M","A","M","J","J","A","S","O","N","D"];
  const YGAP=1.1;                       // a full slot of air between Dec 25 and Jan 26

  keys.forEach((k,qi)=>{
    const ox=(qi%2)*(cw+colGap), oy=Math.floor(qi/2)*(chh+rowGap);
    const d=CUKE[k], L=46,R=6,T=36,B=48;

    const mn=-60,mx=40, y=v=>T+((mx-v)/(mx-mn))*ih;
    const g=el("g",{transform:`translate(${ox},${oy})`});

    // 2026 sits on a faint ground so the two years read apart at a glance
    g.appendChild(el("rect",{x:divX,y:T-6,width:cw-R-divX,height:ih+12,
      fill:cInk,opacity:.028,rx:3}));

    [40,20,0,-20,-40,-60].forEach(v=>gg.appendChild(el("line",{x1:L,x2:cw-R,y1:y(v),y2:y(v)})));

      "shape-rendering":"crispEdges"}));

      const t=el("text",{x:at(i),y:T+ih+17,"text-anchor":"middle",class:"ax","font-size":"11"});
      t.textContent=INI[i%12]; g.appendChild(t);
    });
    [[0,11,"2025"],[12,18,"2026"]].forEach(([a,b,lab])=>{
      const x0=at(a)-step*0.5, x1=at(b)+step*0.5, midX=(x0+x1)/2;
      g.appendChild(el("line",{x1:x0,x2:x1,y1:T+ih+25,y2:T+ih+25,stroke:cL,"stroke-width":1.4}));
      const t=el("text",{x:midX,y:T+ih+41,"text-anchor":"middle",class:"ax","font-size":"12",
        "font-weight":"700"});
      t.textContent=lab; g.appendChild(t);
    });

    const tot=(sum(d.f.slice(12))-sum(d.o.slice(12)))/sum(d.o.slice(12))*100;
    const ttl=el("text",{x:L,y:16,fill:cInk,"font-size":"17","font-weight":"700",
      "font-family":"var(--font)"});
    ttl.textContent=k; g.appendChild(ttl);
    const sub=el("text",{x:L+40,y:16,fill:cM,"font-size":"12","font-weight":"700",
      "font-family":"var(--font)"});
    sub.textContent="2026 YTD"; g.appendChild(sub);
    const val=el("text",{x:L+98,y:16,fill:tot>=0?cG:cR,"font-size":"14","font-weight":"700",
      "font-family":"var(--font)"});
    val.textContent=`${tot>=0?"+":"−"}${Math.abs(tot).toFixed(0)}%`; g.appendChild(val);

    MO.forEach((m,i)=>{
      const r=el("rect",{x:at(i)-step/2,y:T,width:step,height:ih,class:"hit"});
      hoverable(r,`${k} · ${m}`,()=>[
        {c:cM,k:"Ordered",v:nf(d.o[i])+" cases"},
        {c:cG,k:"Shipped",v:nf(d.f[i])+" cases"},
        {c:D[i]>=0?cG:cR,k:"Vs order",v:(D[i]>=0?"+":"−")+Math.abs(D[i]).toFixed(1)+"%"}]);
      r.addEventListener("pointerenter",()=>{g.classList.add("dim");marks[i].classList.add("hi")});
      r.addEventListener("pointerleave",()=>{g.classList.remove("dim");marks[i].classList.remove("hi")});
      g.appendChild(r);
    });
    svg.appendChild(g);
  });
  host.appendChild(svg);
  return {table:dataTable(["Month",...keys],
    MO.map((m,i)=>[m,...keys.map(k=>{
      const v=(CUKE[k].f[i]-CUKE[k].o[i])/CUKE[k].o[i]*100;
      return (v>=0?"+":"−")+Math.abs(v).toFixed(1)+"%";})]))};
}

/* ---- Grow: time in the house vs lb per greenhouse-day --------------- */
function ghTable(host,W_in,H_in){
  const W=1000,H=W*H_in/W_in;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"none"});
  const mk=r=>({n:r[0],d1:r[1],d2:r[2],r1:r[3],r2:r[4],dd:r[2]-r[1],dr:(r[4]-r[3])/r[3]*100});
  const rows=GH.map(mk), tot=mk(GH_TOT);
  const maxD=Math.max(...rows.map(r=>Math.abs(r.dd)));
  const maxR=Math.max(...rows.map(r=>Math.abs(r.dr)));
  const cG=C("--green"),cR=C("--red"),cInk=C("--ink"),cB=C("--body"),cM=C("--muted");
  const COLS=[0,245,385,533,690,838,1000];
  const HEADS=["Greenhouse","Days GH '25","Days GH '26","Δ days","Lb / GH-day '25","Lb / GH-day '26","Δ"];
  let sortKey=null, dir=1;

  function draw(){
    svg.textContent="";
    const g=el("g");
    HEADS.forEach((t,j)=>{
      const tx=el("text",{x:COLS[j],y:16,fill:cM,"font-size":"17","font-weight":"700",
        "font-family":"var(--font)","text-anchor":j?"end":"start",style:"cursor:pointer"});
      tx.textContent=(sortKey===j?(dir>0?"↑ ":"↓ "):"")+t;
      tx.addEventListener("click",()=>{
        if(sortKey===j) dir=-dir; else {sortKey=j;dir=j===0?1:-1;}
        draw();
      });
      g.appendChild(tx);
    });
    g.appendChild(el("line",{x1:0,x2:W,y1:28,y2:28,stroke:C("--line"),"stroke-width":1.4}));

    const keys=[r=>r.n,r=>r.d1,r=>r.d2,r=>r.dd,r=>r.r1,r=>r.r2,r=>r.dr];
    const body=rows.slice();
    if(sortKey!==null){const f=keys[sortKey];
      body.sort((a,b)=>{const A=f(a),B=f(b);return (A>B?1:A<B?-1:0)*dir});}
    const all=body.concat([tot]);
    const top=52, step=(H-top-10)/(all.length-1);

    all.forEach((r,i)=>{
      const y=top+i*step, isTot=i===all.length-1;
      if(isTot) g.appendChild(el("line",{x1:0,x2:W,y1:y-step*0.52,y2:y-step*0.52,
        stroke:C("--line"),"stroke-width":1.4}));
      if(!isTot){
        g.appendChild(el("rect",{x:COLS[3]-72,y:y-11,width:(Math.abs(r.dd)/maxD)*72,height:22,rx:2,
          fill:r.dd>0?cR:cG,opacity:.11,class:"mk gx",style:`--ox:${COLS[3]-72}px;--d:${i*22}ms`}));
        g.appendChild(el("rect",{x:COLS[6]-72,y:y-11,width:(Math.abs(r.dr)/maxR)*72,height:22,rx:2,
          fill:r.dr>=0?cG:cR,opacity:.11,class:"mk gx",style:`--ox:${COLS[6]-72}px;--d:${i*22}ms`}));
      }
      const cells=[[r.n,cInk,"start"],[r.d1.toFixed(1),cB,"end"],[r.d2.toFixed(1),cB,"end"],
        [sgn(r.dd,1),r.dd>0?cR:cG,"end"],[nf(r.r1),cB,"end"],[nf(r.r2),cB,"end"],
        [sgn(r.dr,0)+"%",r.dr>=0?cG:cR,"end"]];
      cells.forEach(([t,c,an],j)=>{
        const tx=el("text",{x:COLS[j],y:y+6,fill:c,"font-size":"19","font-family":"var(--font)",
          "font-variant-numeric":"tabular-nums","text-anchor":an==="start"?"start":"end",
          "font-weight":(isTot||j===0||j===3||j===6)?"700":"400"});
        tx.textContent=t; g.appendChild(tx);
      });
      const hit=el("rect",{x:-6,y:y-step/2,width:W+12,height:step,class:"hit"});
      hoverable(hit,r.n,()=>[
        {c:r.dd>0?cR:cG,k:"Days in the house",v:`${r.d1.toFixed(1)} → ${r.d2.toFixed(1)}  (${sgn(r.dd,1)})`},
        {c:r.dr>=0?cG:cR,k:"Lb per GH-day",v:`${nf(r.r1)} → ${nf(r.r2)}  (${sgn(r.dr,0)}%)`}]);
      g.appendChild(hit);
    });
    svg.appendChild(g);
  }
  draw(); host.appendChild(svg);
  return {table:dataTable(HEADS, rows.concat([tot]).map(r=>
    [r.n,r.d1.toFixed(1),r.d2.toFixed(1),sgn(r.dd,1),nf(r.r1),nf(r.r2),sgn(r.dr,0)+"%"]))};
}

/* ---- Lettuce packhouse, day by day: 2025 vs 2026 on one axis --------
   Weekly mean as the line, every pack day as a dot behind it. A week with
   no recorded data breaks the line rather than interpolating across it.  */
function dayChart(col,{yMax,ticks,fmt,unit,dec=0}){
  return function(host,W_in,H_in){
    const W=1000,H=W*H_in/W_in, L=54,R=16,T=14,B=34;
    const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"none"});
    const iw=W-L-R, ih=H-T-B;
    const x=d=>L+((d-1)/(DOY_END-1))*iw, y=v=>T+ih-(v/yMax)*ih;
    const YR=[[2025,C("--amber")],[2026,C("--green")]];
    const g=el("g");

    const gg=el("g",{class:"grid"});
    ticks.forEach(v=>gg.appendChild(el("line",{x1:L,x2:W-R,y1:y(v),y2:y(v)})));
    MSTART.forEach((d,i)=>{ if(i) gg.appendChild(el("line",{x1:x(d),x2:x(d),y1:T,y2:T+ih})); });
    g.appendChild(gg);
    ticks.forEach(v=>{
      const t=el("text",{x:L-10,y:y(v)+5,"text-anchor":"end",class:"ax","font-size":"14"});
      t.textContent=fmt(v); g.appendChild(t);
    });
    MSTART.forEach((d,i)=>{
      const t=el("text",{x:x(d)+7,y:T+ih+21,class:"ax","font-size":"15"});
      t.textContent=MNAME[i]; g.appendChild(t);
    });

    // daily scatter first, so the weekly line reads on top of it
    YR.forEach(([yr,c])=>{
      DAY[yr].forEach(r=>{ if(r[col]==null) return;
        /* fill-opacity, not opacity: the .fi fade-in rule sets `opacity:1`
           and would override an opacity presentation attribute outright. */
        g.appendChild(el("circle",{cx:x(r[0]),cy:y(Math.min(r[col],yMax)),r:2.4,fill:c,
          "fill-opacity":.22,class:"fi",style:`--d:${.25+(r[0]/DOY_END)*.35}s`}));
      });
    });

    // weekly mean -> one point per ISO-ish week, broken where a week is empty
    const series={};
    YR.forEach(([yr,c])=>{
      const bins=new Map();
      DAY[yr].forEach(r=>{ if(r[col]==null) return;
        const w=Math.floor((r[0]-1)/7);
        if(!bins.has(w)) bins.set(w,[]);
        bins.get(w).push(r[col]);
      });
      const pts=[...bins.keys()].sort((a,b)=>a-b)
        .map(w=>({w,x:x(w*7+4),v:bins.get(w).reduce((s,n)=>s+n,0)/bins.get(w).length}));
      series[yr]=pts;
      let d="",prev=null;
      pts.forEach(p=>{ d+=(prev!==null&&p.w===prev+1?"L":"M")+p.x+","+y(Math.min(p.v,yMax)); prev=p.w; });
      const path=el("path",{d,fill:"none",stroke:c,"stroke-width":3.2,
        "stroke-linejoin":"round","stroke-linecap":"round",class:"drawl",
        style:`--len:4200;--d:${yr===2025?0:.15}s`});
      g.appendChild(path);
    });

    // crosshair + both years at the hovered day
    const cross=el("line",{y1:T,y2:T+ih,stroke:C("--muted"),"stroke-width":1.2,opacity:0});
    g.appendChild(cross);
    const dots=YR.map(([,c])=>{
      const o=el("circle",{r:6,fill:c,stroke:C("--card"),"stroke-width":2.5,opacity:0});
      g.appendChild(o); return o;
    });
    const byDoy={};
    YR.forEach(([yr])=>{byDoy[yr]={}; DAY[yr].forEach(r=>byDoy[yr][r[0]]=r);});
    const hit=el("rect",{x:L,y:T,width:iw,height:ih,class:"hit"});
    hit.addEventListener("pointermove",ev=>{
      const bb=svg.getBoundingClientRect();
      const rel=(ev.clientX-bb.left)/bb.width*W;
      const d=Math.max(1,Math.min(DOY_END,Math.round((rel-L)/iw*(DOY_END-1)+1)));
      cross.setAttribute("x1",x(d)); cross.setAttribute("x2",x(d)); cross.setAttribute("opacity",.45);
      const rows=[];
      YR.forEach(([yr,c],i)=>{
        const r=byDoy[yr][d];
        if(r&&r[col]!=null){
          dots[i].setAttribute("cx",x(d));
          dots[i].setAttribute("cy",y(Math.min(r[col],yMax)));
          dots[i].setAttribute("opacity",1);
          rows.push({c,k:String(yr),v:r[col].toFixed(dec)+" "+unit});
        } else { dots[i].setAttribute("opacity",0); rows.push({c,k:String(yr),v:"no pack day"}); }
      });
      showTip(ev,doyLabel(d),rows);
    });
    hit.addEventListener("pointerleave",()=>{
      cross.setAttribute("opacity",0); dots.forEach(o=>o.setAttribute("opacity",0)); hideTip();
    });
    g.appendChild(hit);
    svg.appendChild(g); host.appendChild(svg);

    const rowsT=[];
    for(let d=1;d<=DOY_END;d++){
      const a=byDoy[2025][d],b=byDoy[2026][d];
      if(!a&&!b) continue;
      rowsT.push([doyLabel(d),
        a&&a[col]!=null?a[col].toFixed(dec):"—",
        b&&b[col]!=null?b[col].toFixed(dec):"—"]);
    }
    return {table:dataTable(["Day","2025","2026"],rowsT)};
  };
}

/* =====================================================================
   NAV
   ===================================================================== */
let cur=0;
const dots=document.getElementById("dots"),count=document.getElementById("count"),ov=document.getElementById("ov");
SLIDES.forEach((s,i)=>{
  dots.appendChild(h("button",{"aria-label":`Slide ${i+1}: ${s.title}`,onclick:()=>go(i)}));
  ov.appendChild(h("button",{class:"ot",onclick:()=>{go(i);toggleOv(false)}},[
    h("span",{class:"num",text:String(i+1).padStart(2,"0")}),
    h("span",{class:"ttl",text:s.title})]));
});
function go(i){
  cur=Math.max(0,Math.min(SLIDES.length-1,i));
  SLIDES.forEach((s,j)=>{
    s.el.classList.toggle("on",j===cur);
    s.el.setAttribute("aria-hidden",String(j!==cur));
  });
  [...dots.children].forEach((d,j)=>d.setAttribute("aria-current",String(j===cur)));
  count.textContent=`${cur+1} / ${SLIDES.length}`;
  hideTip(); location.hash=String(cur+1);
}
const toggleOv=on=>ov.classList.toggle("on",on===undefined?!ov.classList.contains("on"):on);
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
document.getElementById("ovb").onclick=()=>toggleOv();
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){go(cur+1);e.preventDefault()}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){go(cur-1);e.preventDefault()}
  else if(e.key==="Home") go(0);
  else if(e.key==="End") go(SLIDES.length-1);
  else if(e.key.toLowerCase()==="o") toggleOv();
  else if(e.key==="Escape") toggleOv(false);
  else if(/^[1-9]$/.test(e.key)) go(+e.key-1);
});
function fit(){
  stage.style.transform=`scale(${Math.min(innerWidth/1280,innerHeight/720)})`;
}
addEventListener("resize",fit); fit();

/* chrome stays out of the way until the pointer asks for it */
const barEl=document.getElementById("bar");
let barT;
function wakeBar(){
  barEl.classList.add("show");
  clearTimeout(barT);
  barT=setTimeout(()=>barEl.classList.remove("show"),2200);
}
addEventListener("pointermove",wakeBar);
addEventListener("keydown",wakeBar);
wakeBar();
go(Math.max(0,(parseInt(location.hash.slice(1),10)||1)-1));
</script>
