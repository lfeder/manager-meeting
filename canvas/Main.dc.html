<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --ink:#0E1F19; --body:#41544C; --muted:#84968D; --faint:#AEBCB5;
      --line:#E4EAE6; --hair:#EDF1EF;
      --canvas:#FCFDFC; --card:#FFFFFF; --wash:#F5F8F6; --shell:#0B1512;
      --green:#2E8B57; --green-d:#1D6B41; --grn-lt:#A8D5BA;
      --dark:#0F2A21; --red:#C0392B; --amber:#C4881C;
      --s25:#C4881C; --s26:#2E8B57;
      --pos:#44554E; --neg:#C0392B;
      --c1:#7B5EA7; --c2:#3D7EA6; --c3:#2E7D7D; --c4:#647A83;
      --font:-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
      --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
      --shadow:0 1px 2px rgba(14,31,25,.05), 0 18px 40px -26px rgba(14,31,25,.35);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--font);color:var(--body);
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    a{color:var(--green-d)} a:hover{color:var(--green)}
    .slide{width:1280px;height:720px;position:relative;background:var(--canvas);
      display:flex;flex-direction:column;padding:36px 52px 42px;overflow:hidden}
    .shead{flex:none;display:flex;align-items:flex-end;justify-content:space-between;
      gap:28px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
    h1.h1{margin:0;font-size:33px;font-weight:700;letter-spacing:-.026em;color:var(--ink);line-height:1.04}
    .hright{flex:none;display:flex;align-items:center;gap:20px;padding-bottom:4px}
    .pnum{position:absolute;right:52px;bottom:16px;font-family:var(--mono);
      font-size:10px;letter-spacing:.12em;color:var(--faint)}
    .sbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
    .card{position:relative;background:var(--card);border:1px solid var(--line);
      border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;
      min-height:0;min-width:0;overflow:hidden}
    .ceyebrow{font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
    .rail{border-left:3px solid var(--acc,var(--green));padding:19px 19px 16px 18px;
      display:flex;flex-direction:column;gap:9px;justify-content:flex-start}
    .rail .rt{font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.014em;line-height:1.25}
    .rail .rb{font-size:13.5px;line-height:1.6;color:var(--body)}
    .rail .rb.thin{color:var(--faint)}
    .rail .rgo{margin-top:auto;padding-top:8px;font-family:var(--mono);font-size:9.5px;
      font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
    .kl{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.13em;
      text-transform:uppercase;color:var(--muted)}
    .kv{font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1;color:var(--ink);
      font-variant-numeric:tabular-nums}
    .kc{font-size:11.5px;color:var(--body);line-height:1.4}
    .pill{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.01em;
      padding:3px 8px;border-radius:999px;background:var(--wash);color:var(--body)}
    .g4x3{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
      grid-template-rows:repeat(3,minmax(0,1fr));gap:15px}
    .cols{flex:1;min-height:0;display:flex;gap:14px}
  </style>
</helmet>
<div class="slide" style="padding:0 96px;flex-direction:row;align-items:center;justify-content:center;gap:64px;color:#E9F1EC;background:radial-gradient(105% 125% at 12% 0%,#1C3B2C 0%,#0B1512 74%)">
  <img src="hflogo.png" alt="Hawaii Farming" style="height:340px;width:auto;display:block;flex:none">
  <h1 style="margin:0;font-size:96px;font-weight:700;letter-spacing:-.042em;line-height:.96;color:#FFFFFF">Opportunities Discussion</h1>
  <div class="pnum" style="color:rgba(255,255,255,.3)">01 / 15</div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
